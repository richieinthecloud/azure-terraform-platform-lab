name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "environments/dev/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: terraform-apply-dev
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply Dev
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: environments/dev

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Fetch the reviewed plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: prs } = await github.rest.repos
              .listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner, repo: context.repo.repo,
                commit_sha: context.sha,
              });
            if (prs.length === 0) {
              core.setFailed('No PR associated with this commit — cannot locate a reviewed plan.');
              return;
            }
            const name = `tfplan-${prs[0].head.sha}`;
            const { data: arts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner, repo: context.repo.repo, name,
            });
            if (arts.total_count === 0) {
              core.setFailed(`No plan artifact "${name}" found — did the PR check run and upload one?`);
              return;
            }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: arts.artifacts[0].id, archive_format: 'zip',
            });
            fs.writeFileSync(
              `${process.env.GITHUB_WORKSPACE}/environments/dev/tfplan.zip`,
              Buffer.from(dl.data));

      - name: Unpack plan
        run: |
          unzip -o tfplan.zip
          test -f tfplan

      - name: Terraform init
        run: terraform init

      - name: Terraform apply (reviewed plan)
        run: terraform apply tfplan